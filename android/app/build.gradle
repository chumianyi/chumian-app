plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}
def signingFile = rootProject.file("key.properties")
def signingProperties = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
android {
    namespace "app.chumian.anime"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "app.chumian.anime"
        minSdk 26
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}
flutter { source "../.." }
